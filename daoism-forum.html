<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>道德经</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "KaiTi", "STKaiti", "KaiTi_GB2312", "Songti SC", serif;
            height: 100vh;
            height: 100dvh;
            color: #e2e2e2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(ellipse at center, rgb(40,40,40) 0%, #0e0e0e 100%);
        }

        /* 淡入动画 */
        @keyframes fade-in {
            from { opacity: 0; filter: blur(10px); }
            to { opacity: 1; filter: blur(0); }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== 通用布局 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 35px 25px 20px;
            transition: all 0.6s ease;
            z-index: 10;
            flex-shrink: 0;
        }

        .header-title {
            flex: 1;
        }

        .logo {
            font-size: 24px;
            letter-spacing: 10px;
            font-weight: 300;
            color: rgba(248, 246, 242, 0.9);
        }

        .header-icons {
            display: flex;
            gap: 10px;
        }

        .fullscreen-btn {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: rgba(232, 228, 220, 0.8);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
        }

        .fullscreen-btn.visible {
            opacity: 0.6;
            pointer-events: auto;
        }

        .fullscreen-btn:hover {
            opacity: 1;
            background: rgba(255,255,255,0.08);
        }

        .fullscreen-btn:active {
            transform: translateY(-50%) scale(0.9);
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.03);
            color: rgba(248, 246, 242, 0.8);
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        /* 章节导航面板 */
        .nav-panel {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 320px;
            max-width: 85vw;
            z-index: 200;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: rgba(14, 14, 14, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255,255,255,0.06);
        }

        .nav-panel.active {
            transform: translateX(0);
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 500;
            color: #d4af37;
            letter-spacing: 2px;
        }

        .nav-search {
            padding: 15px 20px;
            flex-shrink: 0;
        }

        .nav-search-input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: #e2e2e2;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .nav-search-input:focus {
            border-color: rgba(212, 175, 55, 0.3);
            background: rgba(255,255,255,0.05);
        }

        .nav-search-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .nav-content {
            flex: 1;
            min-height: 0;
            padding: 0 20px 20px;
            overflow-y: auto;
        }

        .nav-chapter-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 8px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .nav-chapter-item:hover {
            background: rgba(255,255,255,0.03);
        }

        .nav-chapter-item.active {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.2);
        }

        .nav-chapter-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 12px;
            flex-shrink: 0;
        }

        .nav-chapter-item.active .nav-chapter-num {
            background: rgba(212, 175, 55, 0.2);
        }

        .nav-chapter-title {
            flex: 1;
            font-size: 14px;
            color: rgba(248, 246, 242, 0.8);
            letter-spacing: 1px;
        }

        .nav-chapter-item.active .nav-chapter-title {
            color: #d4af37;
        }

        .nav-footer {
            padding: 15px 20px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            text-align: center;
        }

        .nav-progress {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
        }

        /* 入定模式样式调整 */
        body.meditation-mode .header,
        body.meditation-mode .bottom-section {
            opacity: 0;
            pointer-events: none;
        }

        .meditation-exit {
            position: fixed;
            top: 40px;
            right: 30px;
            z-index: 300;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        body.meditation-mode .meditation-exit {
            opacity: 0;
            pointer-events: none;
        }

        body.meditation-mode .meditation-exit.visible {
            opacity: 1;
            pointer-events: auto;
        }

        body.meditation-mode .fullscreen-btn {
            opacity: 0;
            pointer-events: none;
        }

        body.meditation-mode .fullscreen-btn.visible {
            opacity: 0.6;
            pointer-events: auto;
        }

        .main-content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: all 0.6s ease;
            padding: 20px 40px;
            z-index: 10;
            position: relative;
        }

        .chapter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            text-align: center;
            position: relative;
            z-index: 10;
            max-width: 100%;
            max-height: 100%;
            overflow: auto;
        }

        .chapter-container.flip-out {
            opacity: 0;
            transform: rotateY(90deg) scale(0.9);
        }

        .chapter-container.flip-in {
            opacity: 0;
            transform: rotateY(-90deg) scale(0.9);
        }

        /* 章节标题 */
        .chapter-header {
            text-align: center;
            margin-bottom: 15px;
            opacity: 0;
            animation: fade-in 1.5s ease-out 0.3s forwards;
        }

        .chapter-num {
            font-size: 11px;
            color: rgba(212, 175, 55, 0.5);
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .chapter-divider {
            width: 35px;
            height: 1px;
            background: rgba(212, 175, 55, 0.25);
            margin: 0 auto;
        }

        /* 横向文字样式 */
        .chapter-content-horizontal {
            font-size: 1.25rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            letter-spacing: 0.25em;
            opacity: 0;
            animation: fade-in 2s ease-out 1s forwards;
            padding: 0 2rem;
            max-width: 90vw;
        }

        @media (min-width: 768px) and (min-height: 600px) {
            .chapter-content-horizontal {
                font-size: 1.75rem;
                line-height: 3.5;
                max-width: 80vw;
            }
        }

        /* 竖向文字样式 */
        .chapter-content-vertical {
            font-size: 1.4rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            letter-spacing: 0.35em;
            opacity: 0;
            animation: fade-in 2s ease-out 1s forwards;
            writing-mode: vertical-rl;
            text-orientation: upright;
            height: 55vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.25em;
            padding: 2rem 0;
        }

        @media (min-width: 768px) and (min-height: 600px) {
            .chapter-content-vertical {
                font-size: 1.8rem;
                height: 60vh;
                gap: 1.5em;
            }
        }

        /* 底部导航 */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px 40px;
            transition: all 0.6s ease;
            z-index: 10;
            flex-shrink: 0;
        }

        .nav-btn, .action-btn {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255,255,255,0.03);
            color: rgba(232, 228, 220, 0.8);
            position: relative;
            overflow: hidden;
        }

        .nav-btn::after, .action-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.3s ease-out;
            opacity: 0;
        }

        .nav-btn:active::after, .action-btn:active::after {
            transform: scale(1);
            opacity: 1;
            transition: 0s;
        }

        .nav-btn:active, .action-btn:active {
            transform: scale(0.9);
        }

        .center-actions {
            display: flex;
            gap: 15px;
        }

        .action-btn.active {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.3);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.2);
        }

        .action-btn.orientation.active {
            color: #e2e2e2;
            border-color: rgba(226, 226, 226, 0.3);
            box-shadow: 0 0 15px rgba(226, 226, 226, 0.2);
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* 主题面板 */
        .theme-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            border-radius: 24px 24px 0 0;
            padding: 25px 20px 35px;
            z-index: 200;
            transform: translateY(100%);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .theme-panel.active {
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            color: #f8f6f2;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            color: #f8f6f2;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .theme-option {
            aspect-ratio: 1;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .theme-option:active {
            transform: scale(0.95);
        }

        .theme-option.active {
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .theme-option[data-scheme="default"] {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(10, 15, 20, 0.8));
            color: #d4af37;
        }

        .theme-option[data-scheme="dark"] {
            background: linear-gradient(135deg, #1a1a2e, #252540);
            color: #4af;
        }

        .theme-option[data-scheme="nature"] {
            background: linear-gradient(135deg, #2d4a3f, #1a3a2a);
            color: #7cb85c;
        }

        .theme-option[data-scheme="purple"] {
            background: linear-gradient(135deg, #3d2d4a, #2a1a3a);
            color: #c9a85c;
        }

        .theme-option[data-scheme="ocean"] {
            background: linear-gradient(135deg, #1a3a4a, #0a2a3a);
            color: #4a9c8a;
        }

        .custom-bg-section {
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
        }

        .custom-bg-title {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 10px;
        }

        .upload-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(255,255,255,0.8);
        }

        /* 解读面板 */
        .interpretation-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 80vh;
            border-radius: 24px 24px 0 0;
            z-index: 200;
            transform: translateY(100%);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .interpretation-panel.active {
            transform: translateY(0);
        }

        .panel-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 15px auto;
        }

        .interpretation-content {
            padding: 0 25px 30px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .interpretation-label {
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-align: center;
            color: #d4af37;
            opacity: 0.8;
        }

        .interpretation-text {
            font-size: 15px;
            line-height: 2.2;
            margin-bottom: 30px;
            color: #e8e4dc;
            text-align: justify;
        }

        /* 评论区 */
        .comments-header {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #f8f6f2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .comment-item {
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a2a3a, #2a1a2a);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 14px;
        }

        .comment-user {
            font-size: 14px;
            font-weight: 500;
            color: #e8e4dc;
        }

        .comment-time {
            font-size: 12px;
            margin-left: auto;
            color: rgba(255,255,255,0.4);
        }

        .comment-text {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255,255,255,0.8);
        }

        .comment-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .comment-action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            transition: all 0.2s;
            padding: 0;
        }

        .comment-action-btn:hover {
            color: rgba(255,255,255,0.7);
        }

        .comment-action-btn.liked {
            color: #d4af37;
        }

        .comment-action-btn .material-symbols-outlined {
            font-size: 16px;
        }

        .comment-likes {
            font-size: 12px;
        }

        /* 回复样式 */
        .replies-section {
            margin-top: 12px;
            padding-left: 12px;
            border-left: 2px solid rgba(255,255,255,0.08);
        }

        .reply-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
        }

        .reply-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .reply-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a2a3a, #2a1a2a);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 10px;
        }

        .reply-user {
            font-size: 12px;
            font-weight: 500;
            color: #e8e4dc;
        }

        .reply-time {
            font-size: 11px;
            margin-left: auto;
            color: rgba(255,255,255,0.3);
        }

        .reply-text {
            font-size: 13px;
            line-height: 1.5;
            color: rgba(255,255,255,0.7);
        }

        .reply-to {
            color: rgba(212, 175, 55, 0.7);
            font-weight: 500;
        }

        .reply-input-area {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        .reply-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            font-size: 12px;
            outline: none;
            color: #e2e2e2;
        }

        .reply-input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .reply-send-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #d4af37;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .reply-send-btn:hover {
            background: rgba(212,175,55,0.15);
        }

        .show-replies-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: rgba(212, 175, 55, 0.7);
            margin-top: 8px;
            padding: 0;
        }

        .show-replies-btn:hover {
            color: #d4af37;
        }

        .comment-input-area {
            position: sticky;
            bottom: 0;
            padding: 15px 0 5px;
            display: flex;
            gap: 12px;
            background: linear-gradient(0deg, rgba(15,20,25,1) 60%, rgba(15,20,25,0));
        }

        .comment-input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            font-size: 14px;
            outline: none;
            color: #e2e2e2;
        }

        .comment-input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #d4af37;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .send-btn:active {
            transform: scale(0.9);
            background: rgba(212,175,55,0.2);
        }

            "知者不言", "以正治国", "其政闷闷", "治人事天", "治大国",
            "大国下流", "善贷", "报怨以德", "谦下", "知病",
            "畏死", "无以生为", "坚强者", "天道", "不争",
            "无死地", "勇不敢", "执兵", "被褐", "知病",
            "不畏威", "心得", "敢为", "奇用兵", "守位",
            "盗夸", "无积", "无为", "好静", "无事",
            "为腹", "异端", "偏将军", "哀者", "知我者",
            "自知", "不失其所", "死而不亡", "道生一", "无有人无间",
            "若水", "柔弱", "报怨", "信道", "民不畏死",

        for (let i = 11; i <= 81; i++) {
            chapters.push({
                id: i,

        // 状态管理
        let currentChapterIndex = 0;
        let collectedChapters = new Set();
        let chapterComments = {};
        let textOrientation = 'horizontal'; // 'horizontal' or 'vertical'

        // 初始化评论数据
        chapters.forEach(chapter => {
            chapterComments[chapter.id] = [];
        });


        // 更新章节显示，带3D翻转效果
        function updateChapter(direction = 'next', animate = true) {
            const chapter = chapters[currentChapterIndex];
            const container = document.getElementById('chapterContainer');

            if (animate) {
                const outClass = direction === 'next' ? 'flip-out' : 'flip-in';
                const inClass = direction === 'next' ? 'flip-in' : 'flip-out';

                container.classList.add(outClass);

                setTimeout(() => {
                    renderChapterContent(chapter);
                    container.classList.remove(outClass);
                    container.classList.add(inClass);

                    // 强制重绘
                    void container.offsetWidth;

                    container.classList.remove(inClass);
                }, 300);
            } else {
                renderChapterContent(chapter);
            }

            updateActionButton('collectBtn', collectedChapters.has(chapter.id));
            document.getElementById('interpretationText').textContent = chapter.interpretation;
            renderComments();
        }

        function toChineseNumeral(n) {
            const digits = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
            if (n < 10) return digits[n];
            if (n === 10) return '十';
            const tens = Math.floor(n / 10), ones = n % 10;
            return (tens > 1 ? digits[tens] : '') + '十' + (ones ? digits[ones] : '');
        }

        function renderChapterContent(chapter) {
            const contentDiv = document.getElementById('chapterContent');
            // 将文本按句号分割并格式化为带标点的行
            const sentences = chapter.content.split(/([。；])/);
            let formattedText = '';
            let currentLine = '';

            for (let i = 0; i < sentences.length; i++) {
                const part = sentences[i].trim();
                if (part) {
                    currentLine += part;
                    // 如果是句号或分号，结束当前行
                    if (part === '。' || part === '；') {
                        formattedText += currentLine + '<br/>';
                        currentLine = '';
                    }
                }
            }
            contentDiv.innerHTML = formattedText;
        }

        // 切换文字方向
        function toggleOrientation() {
            const contentDiv = document.getElementById('chapterContent');
            const btn = document.getElementById('orientationBtn');

            if (textOrientation === 'horizontal') {
                textOrientation = 'vertical';
                contentDiv.className = 'chapter-content-vertical';
                btn.classList.add('active');
            } else {
                textOrientation = 'horizontal';
                contentDiv.className = 'chapter-content-horizontal';
                btn.classList.remove('active');
            }

            // 保存设置
            localStorage.setItem('daoism-text-orientation', textOrientation);
        }

        function updateActionButton(btnId, isActive) {
            const btn = document.getElementById(btnId);
            if (isActive) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        // 切换全屏模式
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // 监听全屏状态变化
        document.addEventListener('fullscreenchange', () => {
            const btn = document.querySelector('.fullscreen-btn');
            const icon = btn.querySelector('span');
            if (document.fullscreenElement) {
                document.body.classList.add('fullscreen-active');
                icon.textContent = 'fullscreen_exit';
            } else {
                document.body.classList.remove('fullscreen-active');
                icon.textContent = 'fullscreen';
            }
        });

        // 上一章
        function prevChapter() {
            if (currentChapterIndex > 0) {
                currentChapterIndex--;
                updateChapter('prev');
            }
        }

        // 下一章
        function nextChapter() {
            if (currentChapterIndex < chapters.length - 1) {
                currentChapterIndex++;
                updateChapter('next');
            }
        }

        // 切换收藏
        function toggleCollect() {
            const chapter = chapters[currentChapterIndex];
            const btn = document.getElementById('collectBtn');

            if (collectedChapters.has(chapter.id)) {
                collectedChapters.delete(chapter.id);
                btn.classList.remove('active');
            } else {
                collectedChapters.add(chapter.id);
                btn.classList.add('active', 'pulse');
                setTimeout(() => btn.classList.remove('pulse'), 500);
            }

            saveState();
            renderCollections();
        }

        // 入定模式
        function toggleMeditation() {
            document.body.classList.toggle('meditation-mode');
        }

        // 点击页面时显示按钮
        document.addEventListener('click', (e) => {
            const fullscreenBtn = document.querySelector('.fullscreen-btn');

            // 入定模式
            if (document.body.classList.contains('meditation-mode')) {
                const exitBtn = document.querySelector('.meditation-exit');

                // 如果点击的不是按钮本身
                if (!e.target.closest('.meditation-exit') && !e.target.closest('.fullscreen-btn')) {
                    if (exitBtn) exitBtn.classList.add('visible');
                    if (fullscreenBtn) fullscreenBtn.classList.add('visible');

                    // 2秒后隐藏按钮
                    setTimeout(() => {
                        if (exitBtn) exitBtn.classList.remove('visible');
                        if (fullscreenBtn) fullscreenBtn.classList.remove('visible');
                    }, 2000);
                }
            } else {
                // 非入定模式，只显示全屏按钮
                if (!e.target.closest('.fullscreen-btn') && !e.target.closest('.nav-btn') && !e.target.closest('.action-btn') && !e.target.closest('.icon-btn') && !e.target.closest('.theme-panel') && !e.target.closest('.interpretation-panel') && !e.target.closest('.collection-panel') && !e.target.closest('.nav-panel')) {
                    if (fullscreenBtn) fullscreenBtn.classList.add('visible');

                    // 2秒后隐藏按钮
                    setTimeout(() => {
                        if (fullscreenBtn) fullscreenBtn.classList.remove('visible');
                    }, 2000);
                }
            }
        });

        // 渲染评论
        function renderComments() {
            const chapter = chapters[currentChapterIndex];
            const comments = chapterComments[chapter.id] || [];
            const container = document.getElementById('commentsList');

            if (comments.length === 0) {
                container.innerHTML = '<div style="text-align:center;opacity:0.3;padding:30px;font-size:13px;">空谷回音，虚位以待...</div>';
                return;
            }

            container.innerHTML = comments.map((comment, commentIndex) => `
                <div class="comment-item">
                    <div class="comment-header">
                        <div class="comment-avatar">${comment.avatar}</div>

                    </div>
                    <div class="comment-text">${comment.text}</div>

                            <span class="comment-likes">${comment.likes || 0}</span>

                        <button class="comment-action-btn" onclick="toggleReplyInput(${chapter.id}, ${commentIndex})">
                            <span class="material-symbols-outlined">reply</span>

                    <div class="reply-input-area" id="replyInput-${chapter.id}-${commentIndex}" style="display: none;">
                        <input class="reply-input" id="replyText-${chapter.id}-${commentIndex}" placeholder="回复 ${comment.user}..." type="text"/>
                        <button class="reply-send-btn" onclick="sendReply(${chapter.id}, ${commentIndex})">
                            <span class="material-symbols-outlined" style="font-size: 14px;">send</span>
                        </button>
                    </div>
                    ${comment.replies && comment.replies.length > 0 ? `
                        <button class="show-replies-btn" onclick="toggleReplies(${chapter.id}, ${commentIndex})" id="showRepliesBtn-${chapter.id}-${commentIndex}">
                            <span class="material-symbols-outlined" style="font-size: 14px;">expand_more</span>
                            ${comment.replies.length} 条回复
                        </button>
                        <div class="replies-section" id="repliesSection-${chapter.id}-${commentIndex}" style="display: none;">
                            ${comment.replies.map(reply => `
                                <div class="reply-item">

                                        <div class="reply-avatar">${reply.avatar}</div>
                                        <div class="reply-user">
                                            ${reply.replyTo ? '<span class="reply-to">回复</span> ' : ''}${reply.user}

                                        </div>
                                        <div class="reply-time">${reply.time}</div>
                                    </div>
                                    <div class="reply-text">${reply.text}</div>
                                </div>
                            `).join('')}
                        </div>

                </div>
            `).join('');

        // 切换点赞
        function toggleLike(chapterId, commentIndex) {
            const comment = chapterComments[chapterId][commentIndex];
            comment.liked = !comment.liked;
            comment.likes = (comment.likes || 0) + (comment.liked ? 1 : -1);
            renderComments();
            saveState();
        }

        // 切换回复输入框
        function toggleReplyInput(chapterId, commentIndex) {
            const inputArea = document.getElementById(`replyInput-${chapterId}-${commentIndex}`);
            if (inputArea) {
                const isHidden = inputArea.style.display === 'none';
                inputArea.style.display = isHidden ? 'flex' : 'none';
                if (isHidden) {
                    const input = document.getElementById(`replyText-${chapterId}-${commentIndex}`);
                    if (input) input.focus();
                }
            }
        }

        // 发送回复
        function sendReply(chapterId, commentIndex) {
            const input = document.getElementById(`replyText-${chapterId}-${commentIndex}`);
            const text = input.value.trim();
            if (!text) return;

            const comment = chapterComments[chapterId][commentIndex];
            const avatars = ['道', '德', '经', '无', '为', '悟', '玄'];

            if (!comment.replies) comment.replies = [];
            comment.replies.unshift({
                user: "修道者",
                avatar: avatars[Math.floor(Math.random() * avatars.length)],
                text: text,
                replyTo: comment.user,
                time: "刚刚"
            });

            input.value = '';
            renderComments();
            saveState();
        }

        // 切换回复显示
        function toggleReplies(chapterId, commentIndex) {
            const repliesSection = document.getElementById(`repliesSection-${chapterId}-${commentIndex}`);
            const btn = document.getElementById(`showRepliesBtn-${chapterId}-${commentIndex}`);

            if (repliesSection && btn) {
                const isHidden = repliesSection.style.display === 'none';
                repliesSection.style.display = isHidden ? 'block' : 'none';
                btn.querySelector('.material-symbols-outlined').textContent = isHidden ? 'expand_less' : 'expand_more';
            }
        }

        // 发送评论
        function sendComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            const chapter = chapters[currentChapterIndex];
            const avatars = ['道', '德', '经', '无', '为', '悟', '玄'];
            const newComment = {
                user: "修道者",
                avatar: avatars[Math.floor(Math.random() * avatars.length)],
                text: text,
                time: "刚刚",
                likes: 0,
                liked: false,
                replies: []
            };

            if (!chapterComments[chapter.id]) chapterComments[chapter.id] = [];
            chapterComments[chapter.id].unshift(newComment);

            input.value = '';
            renderComments();
            saveState();
        }

        // 渲染收藏列表
        function renderCollections() {
            const container = document.getElementById('collectionContent');
            const collected = chapters.filter(c => collectedChapters.has(c.id));

            if (collected.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon material-symbols-outlined" style="font-size:48px;">auto_stories</div>
                        <div>藏经阁空空如也</div>
                    </div>
                `;

            container.innerHTML = collected.map(chapter => `
                <div class="collection-item" onclick="jumpToChapter(${chapter.id})">

                    <div class="collection-item-title">${chapter.title}</div>
                    <div class="collection-item-preview">${chapter.content.substring(0, 35)}...</div>
                </div>
            `).join('');

        // 跳转到指定章节
        function jumpToChapter(id) {
            const oldIndex = currentChapterIndex;
            currentChapterIndex = chapters.findIndex(c => c.id === id);
            updateChapter(currentChapterIndex > oldIndex ? 'next' : 'prev');
            toggleCollectionPanel();

        // 面板控制
        function toggleThemePanel() {
            const panel = document.getElementById('themePanel');
            const overlay = document.getElementById('overlay');
            const wasActive = panel.classList.contains('active');
            closeAllPanels();
            if (!wasActive) {
                panel.classList.add('active');
                overlay.classList.add('active');
            }
        }

        function toggleInterpretation() {
            const panel = document.getElementById('interpretationPanel');
            const overlay = document.getElementById('overlay');
            const wasActive = panel.classList.contains('active');
            closeAllPanels();
            if (!wasActive) {
                panel.classList.add('active');
                overlay.classList.add('active');
            }
        }

        function toggleCollectionPanel() {
            const panel = document.getElementById('collectionPanel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                // 默认显示修道藏经标签页
                renderCollections();
                renderMyComments();
                renderMyReplies();
            }
        }

        // 切换个人中心标签页
        function switchProfileTab(tabName) {
            // 更新标签页按钮状态
            document.querySelectorAll('.profile-tab').forEach((tab, index) => {
                const tabNames = ['collections', 'comments', 'replies'];
                tab.classList.toggle('active', tabNames[index] === tabName);
            });

            // 更新内容区域显示
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            const targetContent = document.getElementById(tabName + 'Tab');
            if (targetContent) {
                targetContent.classList.add('active');
            }

            // 根据标签页渲染对应内容
            if (tabName === 'collections') {
                renderCollections();
            } else if (tabName === 'comments') {
                renderMyComments();
            } else if (tabName === 'replies') {
                renderMyReplies();
            }
        }

        // 渲染我的留言
        function renderMyComments() {
            const container = document.getElementById('myCommentsContent');
            const myComments = [];

            // 收集用户的所有留言
            for (let chapterId in chapterComments) {
                const comments = chapterComments[chapterId];
                comments.forEach((comment, index) => {
                    if (comment.user === "修道者") {
                        const chapter = chapters.find(c => c.id === parseInt(chapterId));
                        myComments.push({
                            chapter: chapter,
                            comment: comment,
                            chapterId: parseInt(chapterId),
                            commentIndex: index
                        });
                    }
                });
            }

            // 按时间倒序排列（最新的在前）
            myComments.reverse();

            if (myComments.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon material-symbols-outlined">chat_bubble_outline</div>
                        <div>暂无悟道留言</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = myComments.map(item => `
                <div class="my-comment-item" onclick="jumpToChapter(${item.chapterId})">
                    <div class="my-comment-chapter">第${item.chapterId}章 · ${item.chapter.title}</div>
                    <div class="my-comment-text">${item.comment.text}</div>
                    <div class="my-comment-meta">
                        <div class="my-comment-likes">
                            <span class="material-symbols-outlined" style="font-size: 14px;">favorite</span>
                            ${item.comment.likes || 0}
                        </div>
                        <div class="my-comment-replies">
                            <span class="material-symbols-outlined" style="font-size: 14px;">reply</span>
                            ${item.comment.replies ? item.comment.replies.length : 0}
                        </div>
                        <div>${item.comment.time}</div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染历史回复
        function renderMyReplies() {
            const container = document.getElementById('myRepliesContent');
            const myReplies = [];

            // 收集用户的所有回复
            for (let chapterId in chapterComments) {
                const comments = chapterComments[chapterId];
                const chapter = chapters.find(c => c.id === parseInt(chapterId));

                comments.forEach((comment) => {
                    if (comment.replies && comment.replies.length > 0) {
                        comment.replies.forEach((reply) => {
                            if (reply.user === "修道者") {
                                myReplies.push({
                                    chapter: chapter,
                                    comment: comment,
                                    reply: reply,
                                    chapterId: parseInt(chapterId)
                                });
                            }
                        });
                    }
                });
            }

            // 按时间倒序排列（最新的在前）
            myReplies.reverse();

            if (myReplies.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon material-symbols-outlined">reply_outline</div>
                        <div>暂无历史回复</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = myReplies.map(item => `
                <div class="reply-history-item" onclick="jumpToChapter(${item.chapterId})">
                    <div class="reply-history-chapter">第${item.chapterId}章 · ${item.chapter.title}</div>
                    <div class="reply-context">
                        回复 <span class="reply-context-user">${item.comment.user}</span>：
                        ${item.comment.text.substring(0, 30)}${item.comment.text.length > 30 ? '...' : ''}
                    </div>
                    <div class="reply-history-text">${item.reply.text}</div>
                    <div class="reply-history-time">${item.reply.time}</div>
                </div>
            `).join('');
        }

        function toggleNavPanel() {

            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                renderNavChapters();
            }
        }

        function closeAllPanels() {
            document.getElementById('themePanel').classList.remove('active');
            document.getElementById('interpretationPanel').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');

        // 渲染导航面板章节列表
        function renderNavChapters(filteredChapters = null) {
            const container = document.getElementById('navContent');
            const chaptersToRender = filteredChapters || chapters;

            container.innerHTML = chaptersToRender.map(chapter => `
                <div class="nav-chapter-item ${chapter.id === currentChapterIndex + 1 ? 'active' : ''}"
                     onclick="jumpToChapterFromNav(${chapter.id})">
                    <div class="nav-chapter-num">${chapter.id}</div>
                    <div class="nav-chapter-title">${chapter.title}</div>
                </div>
            `).join('');

            // 更新阅读进度
            document.getElementById('navProgress').textContent = `阅读进度：${currentChapterIndex + 1}/81`;
        }

        // 从导航面板跳转到章节
        function jumpToChapterFromNav(chapterId) {
            const oldIndex = currentChapterIndex;
            currentChapterIndex = chapters.findIndex(c => c.id === chapterId);
            updateChapter(currentChapterIndex > oldIndex ? 'next' : 'prev');
            toggleNavPanel();
        }

        // 过滤导航面板章节
        function filterNavChapters(query) {
            if (!query.trim()) {
                renderNavChapters();
                return;
            }

            const filtered = chapters.filter(chapter =>
                chapter.title.toLowerCase().includes(query.toLowerCase()) ||
                chapter.content.includes(query)
            );
            renderNavChapters(filtered);
        }

        // 主题切换
        function setScheme(scheme, save = true) {
            document.body.setAttribute('data-scheme', scheme);

            // 重置背景为默认渐变
            document.body.style.background = 'radial-gradient(ellipse at center, rgba(40,40,40,0.4) 0%, #0e0e0e 100%)';
            document.body.style.backgroundImage = '';

            // 更新主题选项状态
            document.querySelectorAll('.theme-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.scheme === scheme) {
                    option.classList.add('active');
                }
            });

            if (save) {
                localStorage.setItem('daoism-scheme', scheme);
                localStorage.removeItem('daoism-custom-bg');
            }
        }

        // 重置为默认样式
        function resetToDefault() {
            document.body.style.background = 'radial-gradient(ellipse at center, rgba(40,40,40,0.4) 0%, #0e0e0e 100%)';
            document.body.style.backgroundImage = '';
            document.body.style.backgroundSize = '';
            document.body.style.backgroundPosition = '';
            document.body.style.backgroundAttachment = '';
            document.body.removeAttribute('data-scheme');

            // 重置主题选项状态
            document.querySelectorAll('.theme-option').forEach(option => {
                option.classList.remove('active');
                if (option.dataset.scheme === 'default') {
                    option.classList.add('active');
                }
            });

            // 清除所有存储的设置
            localStorage.removeItem('daoism-scheme');
            localStorage.removeItem('daoism-custom-bg');
        }

        // 上传背景
        function uploadBackground() {
            document.getElementById('bgInput').click();
        }

        function handleBgUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const bgImage = `url(${e.target.result})`;
                document.body.style.backgroundImage = bgImage;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
                localStorage.setItem('daoism-custom-bg', bgImage);
            };
            reader.readAsDataURL(file);
        }

        // 保存状态
        function saveState() {
            localStorage.setItem('daoism-collected', JSON.stringify([...collectedChapters]));
            localStorage.setItem('daoism-comments', JSON.stringify(chapterComments));
            localStorage.setItem('daoism-chapter-index', currentChapterIndex);
        }

        // 加载状态
        function loadState() {
            const savedCollected = localStorage.getItem('daoism-collected');
            const savedComments = localStorage.getItem('daoism-comments');
            const savedIndex = localStorage.getItem('daoism-chapter-index');
            const savedScheme = localStorage.getItem('daoism-scheme');
            const customBg = localStorage.getItem('daoism-custom-bg');
            const savedOrientation = localStorage.getItem('daoism-text-orientation');

            if (savedCollected) collectedChapters = new Set(JSON.parse(savedCollected));
            if (savedComments) chapterComments = JSON.parse(savedComments);
            if (savedIndex) currentChapterIndex = parseInt(savedIndex);
            if (savedScheme) setScheme(savedScheme, false);
            if (customBg) {
                document.body.style.backgroundImage = customBg;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
            }
            if (savedOrientation) {
                textOrientation = savedOrientation;
                const contentDiv = document.getElementById('chapterContent');
                const btn = document.getElementById('orientationBtn');
                if (textOrientation === 'vertical') {
                    contentDiv.className = 'chapter-content-vertical';
                    btn.classList.add('active');
                }
            }
        }

        // 触摸滑动支持
        let touchStartX = 0;
        document.addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.addEventListener('touchend', e => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextChapter();
                else prevChapter();
            }
        });

        // 键盘支持
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') prevChapter();
            if (e.key === 'ArrowRight') nextChapter();
            if (e.key === 'Escape') closeAllPanels();
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });

        // 初始化
        loadState();
        updateChapter('next', false);
        renderNavChapters();
    </script>
</body>
</html>
